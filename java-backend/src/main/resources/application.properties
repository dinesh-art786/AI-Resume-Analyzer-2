
spring.application.name=resume-analyzer

# Existing SQLite database - do not change
spring.datasource.url=jdbc:sqlite:../backend/database/resume_analyzer.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate - preserve existing database tables
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Server
server.port=8081

# File upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# JWT authentication
app.jwt.secret=${SECRET_KEY}
app.jwt.expiration-minutes=60
app.jwt.algorithm=HS256
